<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Universe Simulation - Android</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #000000; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; width: 100vw; height: 100vh; }
    
    .safe-area-wrapper { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); pointer-events: none; z-index: 1000; }
    #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* V17 Loading Screen Restored */
    #loading-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #02040a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-out; }
    .loader-ring { width: 50px; height: 50px; border: 3px solid rgba(147, 197, 253, 0.1); border-top: 3px solid #93c5fd; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    #loading-text { color: #93c5fd; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; animation: pulse 1.5s infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .fade-out { opacity: 0; pointer-events: none; }
    
    /* Landscape Prompt (No Emojis) */
    #landscape-prompt { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 4, 10, 0.98); backdrop-filter: blur(15px); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; cursor: pointer; }
    #landscape-prompt h2 { font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 10px; }
    #landscape-prompt p { font-size: 0.8rem; color: #64748b; }
    @media screen and (orientation: portrait) { #landscape-prompt { display: flex !important; } }

    /* Clean V17 Top HUD */
    .hud-panel { position: absolute; background: rgba(5, 8, 16, 0.55); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px; pointer-events: auto; }
    .ui-top { top: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; transition: opacity 0.3s ease; }
    .ui-hidden { opacity: 0 !important; pointer-events: none !important; }
    
    .hud-title { font-size: 0.75rem; font-weight: 800; color: #ffffff; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .hud-buttons { display: flex; gap: 8px; }
    .btn-clean { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(147, 197, 253, 0.3); color: #93c5fd; font-size: 0.6rem; font-weight: 700; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
    .btn-clean:hover { background: rgba(147, 197, 253, 0.1); }
    .btn-danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }

    /* Centralized Menus */
    .menu-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 350px; background: rgba(4, 6, 12, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 15px; z-index: 100; display: none; pointer-events: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; }
    .menu-header span { color: #ffffff; font-weight: 800; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; }
    .close-btn { color: #64748b; cursor: pointer; font-size: 1rem; }
    .menu-grid { display: flex; flex-direction: column; gap: 8px; }
    .menu-label { font-size: 0.5rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }

    /* Target Info Panel */
    #info-panel { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 600px; background: rgba(5, 8, 16, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; pointer-events: auto; }
    #info-panel.visible { opacity: 1; pointer-events: auto; }
    .info-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; margin-bottom: 6px; }
    .info-title { font-size: 0.9rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }
    .info-type { font-size: 0.55rem; color: #fcd34d; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .facts-list { font-size: 0.65rem; color: #cbd5e1; list-style: none; padding-left: 10px; margin-top: 8px; }
    .facts-list li { margin-bottom: 6px; position: relative; line-height: 1.4; }
    .facts-list li::before { content: "►"; position: absolute; left: -10px; color: #93c5fd; font-size: 0.4rem; top: 4px; }

    /* Sleek Telemetry Drawer (Lower Third) */
    #telemetry-drawer { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%) translateY(150%); width: 95%; max-width: 600px; background: rgba(2, 4, 10, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 8px; padding: 12px 15px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 6px; }
    #telemetry-drawer.visible { transform: translateX(-50%) translateY(0); }
    .tel-header { display: flex; justify-content: space-between; align-items: center; }
    #tel-title { color: #facc15; font-size: 0.65rem; font-weight: 800; letter-spacing: 2px; margin: 0; }
    #tel-math { font-family: monospace; font-size: 0.85rem; color: #93c5fd; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; border: 1px solid rgba(147, 197, 253, 0.1); margin: 0; text-align: center; }
    #tel-desc { font-size: 0.65rem; color: #94a3b8; line-height: 1.4; margin: 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="landscape-prompt"><h2>ROTATE DEVICE</h2><p>Cinematic orientation required.</p></div>
  <div id="loading-screen"><div class="loader-ring"></div><div id="loading-text">LOADING TEXTURES</div></div>

  <div id="webgl-container"></div>

  <div class="safe-area-wrapper">
      
      <!-- MAIN HUD -->
      <div id="main-ui" class="hud-panel ui-top">
        <div class="hud-title">UNIVERSE SIM</div>
        <div class="hud-buttons">
          <button id="btnFreeCam" class="btn-clean btn-danger" style="display:none;" onclick="resetCamera()">UNLOCK CAM</button>
          <button class="btn-clean" onclick="openMenu('lab-modal')">LAB</button>
          <button class="btn-clean" onclick="openMenu('warp-modal')">WARP</button>
        </div>
      </div>

      <!-- TARGET INFO -->
      <div id="info-panel">
        <div class="info-header">
            <div>
                <div class="info-title" id="infoTitle">Object Name</div>
                <div class="info-type" id="infoType">Classification</div>
            </div>
            <span class="close-btn" onclick="closeInfo()">✕</span>
        </div>
        <ul class="facts-list" id="infoFactsList"></ul>
      </div>

      <!-- LAB MODAL -->
      <div id="lab-modal" class="menu-modal">
        <div class="menu-header"><span>Sandbox Laboratory</span><span class="close-btn" onclick="closeMenu('lab-modal')">✕</span></div>
        <div class="menu-grid">
            <div class="menu-label">Celestial Transmutation</div>
            <button class="btn-clean btn-danger" onclick="triggerTransmutation('blackhole')">Spawn 1M☉ Black Hole</button>
            <button class="btn-clean btn-danger" onclick="triggerTransmutation('neutron')">Spawn Neutron Star</button>
            <button class="btn-clean btn-danger" onclick="triggerTransmutation('saturn')">Spawn Saturn (Mass Drop)</button>
            <button class="btn-clean" onclick="resetSimulation()" style="border-color: #4ade80; color: #4ade80;">Reset Solar System</button>
            
            <div class="menu-label">Spectrum Filters</div>
            <button class="btn-clean" onclick="applyFilter('normal')">Visible Light (Standard)</button>
            <button class="btn-clean" style="color:#67e8f9;" onclick="applyFilter('xray')">X-Ray (Structural)</button>
        </div>
      </div>

      <!-- WARP MODAL -->
      <div id="warp-modal" class="menu-modal">
        <div class="menu-header"><span>Navigation</span><span class="close-btn" onclick="closeMenu('warp-modal')">✕</span></div>
        <div class="menu-grid">
            <button class="btn-clean" onclick="initiateWarp('home')">Solar System</button>
            <button class="btn-clean" onclick="initiateWarp('vela')">Magnetic Pulsar</button>
            <button class="btn-clean" onclick="initiateWarp('sagA')">Sagittarius A*</button>
        </div>
      </div>

      <!-- SLEEK TELEMETRY BAR -->
      <div id="telemetry-drawer">
        <div class="tel-header">
            <span id="tel-title">TRANSFORMATION DETECTED</span>
            <span class="close-btn" style="font-size: 0.8rem;" onclick="closeTelemetry()">✕</span>
        </div>
        <div id="tel-math">F = G(m₁m₂)/r²</div>
        <div id="tel-desc">Calculating consequences...</div>
      </div>

  </div>

  <script>
    // DATABASE
    const DATABASE = {
      "Sun": { type: "G-Type Star", facts: ["Perfect sphere of incredibly hot plasma.", "Accounts for 99.86% of total solar system mass.", "Core temperature hits 15 million °C."] },
      "Earth": { type: "Terrestrial Planet", facts: ["Only planet confirmed to harbor life.", "71% surface covered in liquid water.", "Densest planet in the system."] },
      "Jupiter": { type: "Gas Giant", facts: ["Largest planet; holds 1,300 Earths.", "Home to the Great Red Spot.", "Rotates fully in just 10 hours."] },
      "Saturn": { type: "Gas Giant", facts: ["Famous for complex, beautiful ice rings.", "Least dense planet (would float in water).", "Has 146 confirmed moons."] },
      "Magnetic Pulsar": { type: "Neutron Star", facts: ["Ultra-dense collapsed core of a dead star.", "Spins at terrifying rates.", "Emits lighthouse-like beams of radiation."] },
      "Sagittarius A*": { type: "Supermassive Black Hole", facts: ["4.3 million solar masses.", "Located at the center of the Milky Way.", "Event horizon spans 24 million km."] }
    };

    // UI CONTROLS
    function openMenu(id) { document.querySelectorAll('.menu-modal').forEach(m => m.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
    function closeMenu(id) { document.getElementById(id).style.display = 'none'; }
    function closeInfo() { document.getElementById('info-panel').classList.remove('visible'); }
    function closeTelemetry() { document.getElementById('telemetry-drawer').classList.remove('visible'); document.getElementById('main-ui').classList.remove('ui-hidden'); }
    function resetCamera() { targetCamPos = new THREE.Vector3(0, 40, 100); targetLookAt = new THREE.Vector3(0, 0, 0); closeInfo(); document.getElementById('btnFreeCam').style.display = 'none'; }

    window.lockLandscape = function() { 
        const p = document.getElementById('landscape-prompt'); if (p) p.style.display = 'none'; 
        const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(()=>{}); 
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); 
    };
    window.addEventListener('click', window.lockLandscape, { once: true }); 
    window.addEventListener('touchstart', window.lockLandscape, { once: true });

    // THREE.JS SETUP
    const container = document.getElementById('webgl-container'); 
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000); 
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    renderer.toneMapping = THREE.ACESFilmicToneMapping; container.appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement); 
    controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxDistance = 100000; controls.minDistance = 3;

    // LOCATIONS
    const LOCATIONS = {
      home: { pos: new THREE.Vector3(0, 0, 0), offset: new THREE.Vector3(0, 40, 100) },
      vela: { pos: new THREE.Vector3(2000, 500, -2000), offset: new THREE.Vector3(0, 20, 60) }, 
      sagA: { pos: new THREE.Vector3(-4000, -1000, 3000), offset: new THREE.Vector3(0, 200, 500) }
    };

    // TEXTURE LOADER (Fixed to ensure rendering)
    const manager = new THREE.LoadingManager();
    manager.onLoad = function () { 
        const ls = document.getElementById('loading-screen'); 
        ls.classList.add('fade-out'); setTimeout(() => ls.remove(), 1000); animate(); 
    };
    const textureLoader = new THREE.TextureLoader(manager); textureLoader.setCrossOrigin('anonymous'); 
    const TEX = { stars: './2k_stars_milky_way.jpg', earthMap: './2k_earth_daymap.jpg', jupiter: './2k_jupiter.jpg', saturn: './2k_saturn.jpg', moon: './2k_moon.jpg' };

    function createGlowTex() { 
        const c = document.createElement('canvas'); c.width = 128; c.height = 128; const ctx = c.getContext('2d'); 
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); 
        ctx.fillStyle = g; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); 
    }
    const softGlowTex = createGlowTex();

    const interactables = []; const allMeshes = [];

    // SKYBOX
    const skyGeo = new THREE.SphereGeometry(800000, 64, 64);
    const skyMat = new THREE.MeshBasicMaterial({ map: textureLoader.load(TEX.stars), side: THREE.BackSide, depthWrite: false });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // SUN (Restored Volumetric Glow)
    const solarSystem = new THREE.Group(); scene.add(solarSystem);
    solarSystem.add(new THREE.AmbientLight(0x333344, 0.6)); 

    let currentSun = new THREE.Group(); solarSystem.add(currentSun);
    const sunCore = new THREE.Mesh(new THREE.SphereGeometry(6.0, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
    sunCore.userData = { name: "Sun", size: 6.0 }; interactables.push(sunCore); allMeshes.push(sunCore); currentSun.add(sunCore);
    
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0xff7700, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    sunGlow.scale.set(25, 25, 1); currentSun.add(sunGlow);
    const sunOuter = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0xff4400, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }));
    sunOuter.scale.set(45, 45, 1); currentSun.add(sunOuter);
    currentSun.add(new THREE.PointLight(0xffffff, 2.0, 10000));

    // PLANETS
    let isPhysicsBroken = false; let planetDataList = [];
    const planets = [
      { name: "Earth", radius: 30, speed: 0.006, size: 1.2, type: 'earthMap' }, 
      { name: "Jupiter", radius: 55, speed: 0.002, size: 3.0, type: 'jupiter' }, 
      { name: "Saturn", radius: 78, speed: 0.0014, size: 2.5, type: 'saturn', hasRings: true }
    ];
    
    planets.forEach(p => {
      const ringGeo = new THREE.BufferGeometry(); const points = [];
      for (let i = 0; i <= 100; i++) { const t = (i/100)*Math.PI*2; points.push(new THREE.Vector3(Math.cos(t)*p.radius, 0, Math.sin(t)*p.radius)); }
      ringGeo.setFromPoints(points); 
      const orbitLine = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, depthWrite: false }));
      solarSystem.add(orbitLine);
      
      const pivot = new THREE.Group(); solarSystem.add(pivot);
      let pMat = new THREE.MeshPhongMaterial({ map: textureLoader.load(TEX[p.type] || TEX.moon), shininess: 10 });
      const pMesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), pMat);
      pMesh.position.x = p.radius; 
      pMesh.userData = { name: p.name, size: p.size, origMat: pMat }; 
      pivot.add(pMesh); p.pivot = pivot; p.mesh = pMesh; p.orbitLine = orbitLine;
      interactables.push(pMesh); allMeshes.push(pMesh); planetDataList.push(p);
      
      if (p.hasRings) {
          const rMesh = new THREE.Mesh(new THREE.TorusGeometry(p.size * 2, 0.1, 16, 100), new THREE.MeshPhongMaterial({ color: 0xcd853f, transparent: true, opacity: 0.8 }));
          rMesh.rotation.x = Math.PI / 2.1; rMesh.userData = { origMat: rMesh.material };
          pMesh.add(rMesh); allMeshes.push(rMesh);
      }
    });

    // PULSAR (Restored V16 Geometry)
    const pulsarGroup = new THREE.Group(); pulsarGroup.position.copy(LOCATIONS.vela.pos); scene.add(pulsarGroup);
    const nStar = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    nStar.userData = { name: "Magnetic Pulsar", size: 12, origMat: nStar.material }; interactables.push(nStar); allMeshes.push(nStar); pulsarGroup.add(nStar);
    
    const pAura = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0x55aaff, transparent: true, blending: THREE.AdditiveBlending }));
    pAura.scale.set(30, 30, 1); pulsarGroup.add(pAura);

    const jetGeo = new THREE.CylinderGeometry(0.2, 10, 1000, 32, 1, true); 
    const jetMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const pJet1 = new THREE.Mesh(jetGeo, jetMat); pJet1.position.y = 500; pulsarGroup.add(pJet1); 
    const pJet2 = new THREE.Mesh(jetGeo, jetMat); pJet2.position.y = -500; pJet2.rotation.x = Math.PI; pulsarGroup.add(pJet2);
    for(let i=0; i<3; i++) { 
        let torus = new THREE.Mesh(new THREE.TorusGeometry(10 + (i*5), 0.1, 16, 100), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending})); 
        torus.rotation.y = (Math.PI / 4) * i; torus.rotation.x = Math.PI / 2.2; pulsarGroup.add(torus); 
    }

    // BLACK HOLE (Sag A*)
    const sagGroup = new THREE.Group(); sagGroup.position.copy(LOCATIONS.sagA.pos); scene.add(sagGroup);
    const eh = new THREE.Mesh(new THREE.SphereGeometry(30, 64, 64), new THREE.MeshBasicMaterial({ color: 0x000000 })); 
    eh.userData = { name: "Sagittarius A*", size: 60 }; interactables.push(eh); sagGroup.add(eh);
    const accretion = new THREE.Mesh(new THREE.RingGeometry(40, 100, 64), new THREE.MeshBasicMaterial({ color: 0xffaa44, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }));
    accretion.rotation.x = Math.PI / 1.7; sagGroup.add(accretion);

    // INTERACTION LOGIC
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    let targetCamPos = null; let targetLookAt = null;

    window.addEventListener('pointerdown', (event) => {
        if(event.target.tagName === 'BUTTON' || event.target.closest('.hud-panel') || event.target.closest('.menu-modal') || event.target.closest('#info-panel') || event.target.closest('#telemetry-drawer')) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactables, false);
        if(intersects.length > 0) {
            const mesh = intersects[0].object; const name = mesh.userData.name;
            if(DATABASE[name]) {
                document.getElementById('infoTitle').textContent = name; document.getElementById('infoType').textContent = DATABASE[name].type;
                const list = document.getElementById('infoFactsList'); list.innerHTML = '';
                DATABASE[name].facts.forEach(f => { let li = document.createElement('li'); li.textContent = f; list.appendChild(li); });
                document.getElementById('info-panel').classList.add('visible'); document.getElementById('btnFreeCam').style.display = 'block';
            }
            const wPos = new THREE.Vector3(); mesh.getWorldPosition(wPos); targetLookAt = wPos.clone();
            const safeDist = Math.max(mesh.userData.size * 3.5, 15); targetCamPos = new THREE.Vector3(wPos.x + safeDist, wPos.y + (safeDist*0.5), wPos.z + safeDist);
            controls.target.copy(targetLookAt);
        }
    });

    window.initiateWarp = function(destCode) {
        closeMenu('warp-modal'); closeInfo(); document.getElementById('btnFreeCam').style.display = 'block';
        const dest = LOCATIONS[destCode]; targetCamPos = dest.pos.clone().add(dest.offset); targetLookAt = dest.pos.clone();
        controls.target.copy(targetLookAt);
    };

    window.applyFilter = function(type) {
        closeMenu('lab-modal');
        allMeshes.forEach(mesh => {
            if(!mesh.userData.origMat) return;
            mesh.material = type === 'xray' ? new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.8 }) : mesh.userData.origMat;
        });
    };

    let currentTransmuteObj = null;
    window.triggerTransmutation = function(type) {
        closeMenu('lab-modal'); closeInfo(); document.getElementById('main-ui').classList.add('ui-hidden');
        const drawer = document.getElementById('telemetry-drawer');
        if(currentTransmuteObj) solarSystem.remove(currentTransmuteObj);
        sunCore.visible = false; sunGlow.visible = false; sunOuter.visible = false; isPhysicsBroken = false;

        if (type === 'blackhole') {
            drawer.querySelector('#tel-title').textContent = "1M☉ BLACK HOLE DETECTED";
            drawer.querySelector('#tel-math').innerHTML = "<i>v = √(GM/r)</i> | Mass Remains Constant";
            drawer.querySelector('#tel-desc').textContent = "Gravity unaffected. Earth orbit remains stable in absolute darkness.";
            currentTransmuteObj = new THREE.Group();
            currentTransmuteObj.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const disk = new THREE.Mesh(new THREE.RingGeometry(1.5, 4, 64), new THREE.MeshBasicMaterial({color: 0xffaa44, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
            disk.rotation.x = Math.PI / 1.7; currentTransmuteObj.add(disk);
            solarSystem.add(currentTransmuteObj);
        } else if (type === 'neutron') {
            drawer.querySelector('#tel-title').textContent = "NEUTRON STAR DETECTED";
            drawer.querySelector('#tel-math').innerHTML = "<i>Density = M / V</i> | r → 10km";
            drawer.querySelector('#tel-desc').textContent = "Mass maintained. Orbits stable, but radiation obliterates planetary atmospheres.";
            currentTransmuteObj = new THREE.Group();
            currentTransmuteObj.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({color: 0xffffff})));
            const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0x55aaff, transparent: true, blending: THREE.AdditiveBlending }));
            aura.scale.set(10, 10, 1); currentTransmuteObj.add(aura);
            solarSystem.add(currentTransmuteObj);
        } else if (type === 'saturn') {
            drawer.querySelector('#tel-title').textContent = "GRAVITATIONAL BOND BROKEN";
            drawer.querySelector('#tel-math').innerHTML = "<i>F = G(m₁m₂)/r²</i> | Mass dropped by 99.9%";
            drawer.querySelector('#tel-desc').textContent = "Sun replaced by Saturn. Planets detach from orbit and drift into deep space.";
            isPhysicsBroken = true; 
            currentTransmuteObj = new THREE.Group();
            currentTransmuteObj.add(new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 32), new THREE.MeshPhongMaterial({map: textureLoader.load(TEX.saturn)})));
            const rings = new THREE.Mesh(new THREE.TorusGeometry(5, 0.1, 16, 100), new THREE.MeshBasicMaterial({color: 0xcd853f}));
            rings.rotation.x = Math.PI/2.1; currentTransmuteObj.add(rings);
            solarSystem.add(currentTransmuteObj);
            planetDataList.forEach(p => { p.orbitLine.visible = false; });
        }
        targetCamPos = new THREE.Vector3(0, 20, 60); targetLookAt = new THREE.Vector3(0, 0, 0); controls.target.copy(targetLookAt);
        drawer.classList.add('visible');
    };

    window.resetSimulation = function() {
        closeMenu('lab-modal'); if(currentTransmuteObj) { solarSystem.remove(currentTransmuteObj); currentTransmuteObj = null; }
        sunCore.visible = true; sunGlow.visible = true; sunOuter.visible = true; isPhysicsBroken = false;
        planetDataList.forEach(p => { p.mesh.position.set(p.radius, 0, 0); p.pivot.rotation.y = 0; p.orbitLine.visible = true; });
        resetCamera();
    };

    // BOOT
    targetCamPos = LOCATIONS.home.pos.clone().add(LOCATIONS.home.offset); targetLookAt = LOCATIONS.home.pos.clone();
    controls.target.copy(targetLookAt);

    function animate() {
      requestAnimationFrame(animate);
      sunCore.rotation.y += 0.002; pulsarGroup.rotation.z += 0.08; pulsarGroup.rotation.y += 0.04; sagGroup.rotation.y -= 0.005;
      if(currentTransmuteObj) currentTransmuteObj.rotation.y -= 0.01;

      planetDataList.forEach(p => { 
          p.mesh.rotation.y += 0.01;
          if (isPhysicsBroken) { p.radius += p.speed * 150; p.mesh.position.x = p.radius; } else { p.pivot.rotation.y += p.speed; }
      });

      if (targetCamPos && targetLookAt) {
          camera.position.lerp(targetCamPos, 0.06); 
          if (camera.position.distanceTo(targetCamPos) < 0.5) { targetCamPos = null; targetLookAt = null; }
      }
      controls.update(); renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  </script>
</body>
</html>
