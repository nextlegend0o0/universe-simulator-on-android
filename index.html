<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Universe Simulation - Android</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #000000; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; width: 100vw; height: 100vh; }
    
    /* SAFE AREA INSETS FOR NOTCH & CAMERAS */
    .safe-area-wrapper {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      pointer-events: none; z-index: 1000;
    }

    #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* LOADING SCREEN */
    #loading-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #02040a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-out; }
    #loading-text { color: #ffffff; font-size: 1.5rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; font-family: monospace; }
    .fade-out { opacity: 0; pointer-events: none; }
    
    /* LANDSCAPE PROMPT */
    #landscape-prompt { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 4, 10, 0.98); backdrop-filter: blur(15px); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; cursor: pointer; }
    @media screen and (orientation: portrait) { #landscape-prompt { display: flex !important; } }

    /* RADIAL WEAPON-WHEEL MENU */
    #radial-menu { position: absolute; bottom: 30px; right: 30px; pointer-events: auto; z-index: 2000; transition: opacity 0.3s ease; }
    .master-node { width: 60px; height: 60px; border-radius: 50%; background: rgba(10, 15, 30, 0.85); border: 1px solid rgba(147, 197, 253, 0.4); color: #93c5fd; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    .radial-item { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(10, 15, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    /* The curved arc trajectory for the bubbles */
    #radial-menu.open .master-node { transform: rotate(45deg); background: rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 0.5); color: white; }
    #radial-menu.open .radial-item { opacity: 1; pointer-events: auto; }
    #radial-menu.open .item-1 { transform: translate(-90px, 0px); }
    #radial-menu.open .item-2 { transform: translate(-75px, -75px); }
    #radial-menu.open .item-3 { transform: translate(0px, -90px); }

    /* POP-UP LAB PANELS */
    .glass-panel { position: absolute; bottom: 100px; right: 30px; width: 280px; background: rgba(5, 8, 16, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(147, 197, 253, 0.2); border-radius: 12px; padding: 15px; opacity: 0; pointer-events: none; transition: all 0.3s ease; transform: translateY(20px); pointer-events: auto; }
    .glass-panel.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .panel-title { color: #93c5fd; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
    .action-btn { display: block; width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #e2e8f0; padding: 8px; margin-bottom: 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; cursor: pointer; text-align: left; transition: 0.2s; }
    .action-btn:hover { background: rgba(147, 197, 253, 0.2); }
    .danger-btn { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

    /* TARGET INFO PANEL (Cleaned Up) */
    #info-panel { position: absolute; top: 30px; left: 30px; width: 320px; background: rgba(5, 8, 16, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; pointer-events: auto; }
    #info-panel.visible { opacity: 1; pointer-events: auto; }
    .info-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; text-transform: uppercase; }
    .info-type { font-size: 0.65rem; color: #fcd34d; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 10px; }
    .close-btn { position: absolute; top: 15px; right: 15px; color: #64748b; cursor: pointer; font-weight: bold; }
    .facts-list { font-size: 0.75rem; color: #cbd5e1; list-style: none; padding-left: 10px; }
    .facts-list li { margin-bottom: 8px; position: relative; }
    .facts-list li::before { content: "►"; position: absolute; left: -12px; color: #93c5fd; font-size: 0.5rem; top: 3px; }

    /* TELEMETRY DRAWER (Math & Physics Sandbox Output) */
    #telemetry-drawer { position: absolute; bottom: -100%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: rgba(2, 4, 10, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(234, 179, 8, 0.4); border-radius: 12px 12px 0 0; padding: 20px; transition: bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
    #telemetry-drawer.visible { bottom: 0; }
    #tel-title { color: #facc15; font-size: 0.9rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
    #tel-math { font-family: monospace; font-size: 1.1rem; color: #93c5fd; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(147, 197, 253, 0.2); }
    #tel-desc { font-size: 0.8rem; color: #e2e8f0; line-height: 1.5; }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="landscape-prompt"><div style="font-size: 2rem; margin-bottom:10px;">🔄</div><h2>ROTATE DEVICE</h2><p>Tap to enter cinematic view.</p></div>
  <div id="loading-screen"><div id="loading-text">0%</div></div>

  <div id="webgl-container"></div>

  <!-- UI OVERLAY SAFE WRAPPER -->
  <div class="safe-area-wrapper">
      
      <!-- TARGET INFO -->
      <div id="info-panel">
        <span class="close-btn" onclick="closeInfo()">✕</span>
        <div class="info-title" id="infoTitle">Object Name</div>
        <span class="info-type" id="infoType">Classification</span>
        <ul class="facts-list" id="infoFactsList"></ul>
      </div>

      <!-- RADIAL MENU -->
      <div id="radial-menu">
        <div class="radial-item item-3" onclick="openPanel('panel-transmute')" title="Celestial Transmuter">🧪</div>
        <div class="radial-item item-2" onclick="openPanel('panel-filters')" title="Spectrum Filters">👁️</div>
        <div class="radial-item item-1" onclick="resetCamera()" title="Reset Camera">📷</div>
        <div class="master-node" onclick="toggleRadial()">⚙️</div>
      </div>

      <!-- SPECTRUM FILTER PANEL -->
      <div id="panel-filters" class="glass-panel">
        <div class="panel-title">Spectrum Filters</div>
        <button class="action-btn" onclick="applyFilter('normal')">Standard Visible Light</button>
        <button class="action-btn" onclick="applyFilter('xray')" style="color: #67e8f9;">X-Ray (Structural Wireframe)</button>
        <button class="action-btn" onclick="applyFilter('infrared')" style="color: #fca5a5;">Infrared (Thermal Mapping)</button>
      </div>

      <!-- CELESTIAL TRANSMUTER PANEL -->
      <div id="panel-transmute" class="glass-panel">
        <div class="panel-title">Celestial Transmuter</div>
        <div style="font-size: 0.6rem; color:#94a3b8; margin-bottom: 8px;">Replace the Sun and calculate astrophysical consequences.</div>
        <button class="action-btn danger-btn" onclick="triggerTransmutation('blackhole')">Swap with 1M☉ Black Hole</button>
        <button class="action-btn danger-btn" onclick="triggerTransmutation('neutron')">Swap with Neutron Star</button>
        <button class="action-btn danger-btn" onclick="triggerTransmutation('saturn')">Swap with Saturn (Mass Drop)</button>
        <button class="action-btn" onclick="resetSimulation()" style="margin-top: 10px;">Reset Solar System</button>
      </div>

      <!-- BOTTOM TELEMETRY DRAWER -->
      <div id="telemetry-drawer">
        <h3 id="tel-title">TRANSFORMATION DETECTED</h3>
        <div id="tel-math">F = G (m₁m₂) / r²</div>
        <p id="tel-desc">Calculating consequences...</p>
        <button class="action-btn" style="width: 150px; margin: 15px auto 0 auto;" onclick="closeTelemetry()">DISMISS</button>
      </div>

  </div>

  <script>
    // CORE DATABASE (No Audio)
    const DATABASE = {
      "Sun": { type: "G-Type Star", facts: ["Perfect sphere of incredibly hot plasma.", "Accounts for 99.86% of total solar system mass.", "Core temperature hits 15 million °C."] },
      "Earth": { type: "Terrestrial Planet", facts: ["Only planet confirmed to harbor life.", "71% surface covered in liquid water.", "Densest planet in the system."] },
      "Jupiter": { type: "Gas Giant", facts: ["Largest planet; holds 1,300 Earths.", "Home to the Great Red Spot.", "Rotates fully in just 10 hours."] },
      "Saturn": { type: "Gas Giant", facts: ["Famous for complex, beautiful ice rings.", "Least dense planet (would float in water).", "Has 146 confirmed moons."] },
      "Magnetic Pulsar": { type: "Neutron Star", facts: ["Ultra-dense collapsed core of a dead star.", "Spins at terrifying rates.", "Emits lighthouse-like beams of radiation."] },
      "Binary Merger": { type: "Gravitational Anomaly", facts: ["Two black holes in a fatal orbit.", "Emits gravitational waves.", "Will merge into a single massive singularity."] }
    };

    // UI LOGIC
    let radialOpen = false;
    function toggleRadial() {
      radialOpen = !radialOpen;
      const rm = document.getElementById('radial-menu');
      if (radialOpen) { rm.classList.add('open'); } 
      else { 
          rm.classList.remove('open'); 
          document.querySelectorAll('.glass-panel').forEach(p => p.classList.remove('visible'));
      }
    }
    
    function openPanel(id) {
      document.querySelectorAll('.glass-panel').forEach(p => p.classList.remove('visible'));
      document.getElementById(id).classList.add('visible');
    }

    function closeInfo() { document.getElementById('info-panel').classList.remove('visible'); }
    function closeTelemetry() { 
        document.getElementById('telemetry-drawer').classList.remove('visible'); 
        document.getElementById('radial-menu').style.opacity = '1';
    }

    window.lockLandscape = function() { 
        const p = document.getElementById('landscape-prompt'); if (p) p.style.display = 'none'; 
        const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(()=>{}); 
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); 
    };
    window.addEventListener('click', window.lockLandscape, { once: true }); 
    window.addEventListener('touchstart', window.lockLandscape, { once: true });

    // THREE.JS SETUP
    const container = document.getElementById('webgl-container'); 
    const scene = new THREE.Scene(); 
    scene.background = new THREE.Color(0x000000); 
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight); 
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    renderer.toneMapping = THREE.ACESFilmicToneMapping; 
    container.appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement); 
    controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxDistance = 100000; controls.minDistance = 3;

    // TEXTURES
    const manager = new THREE.LoadingManager();
    manager.onLoad = function () { 
        const ls = document.getElementById('loading-screen'); 
        ls.classList.add('fade-out'); 
        setTimeout(() => ls.remove(), 1000); 
        animate(); 
    };
    manager.onProgress = function (u, i, t) { 
        document.getElementById('loading-text').innerText = Math.round((i/t)*100) + '%'; 
    };

    const textureLoader = new THREE.TextureLoader(manager); 
    textureLoader.setCrossOrigin('anonymous'); 
    const TEX = { 
        stars: './2k_stars_milky_way.jpg', 
        earthMap: './2k_earth_daymap.jpg', 
        jupiter: './2k_jupiter.jpg', 
        saturn: './2k_saturn.jpg', 
        moon: './2k_moon.jpg' 
    };

    // PROCEDURAL TEXTURE GENERATOR
    function createGlowTex() { 
        const c = document.createElement('canvas'); c.width = 128; c.height = 128; const ctx = c.getContext('2d'); 
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); 
        g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); 
        ctx.fillStyle = g; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); 
    }
    const softGlowTex = createGlowTex();

    const interactables = [];
    const allMeshes = []; // For spectrum filters

    // SKYBOX (Clean Stars, no blinding blobs)
    const skyGeo = new THREE.SphereGeometry(800000, 64, 64);
    const skyMat = new THREE.MeshBasicMaterial({ map: textureLoader.load(TEX.stars), side: THREE.BackSide, depthWrite: false });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // SUN FIX: Yellow fiery core, no massive white blowout
    const solarSystem = new THREE.Group(); scene.add(solarSystem);
    solarSystem.add(new THREE.AmbientLight(0x333344, 0.6)); 

    let currentSun = new THREE.Group();
    solarSystem.add(currentSun);

    const sunCore = new THREE.Mesh(new THREE.SphereGeometry(6.0, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
    sunCore.userData = { name: "Sun", size: 6.0 }; 
    interactables.push(sunCore); allMeshes.push(sunCore); currentSun.add(sunCore);
    
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0xff7700, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
    sunGlow.scale.set(25, 25, 1); currentSun.add(sunGlow);
    
    const sunLight = new THREE.PointLight(0xffffff, 2.0, 10000); 
    currentSun.add(sunLight);

    // PERFECT PHYSICS PLANETS
    let isPhysicsBroken = false;
    let planetDataList = [];

    const planets = [
      { name: "Earth", radius: 30, speed: 0.006, size: 1.2, type: 'earth' }, 
      { name: "Jupiter", radius: 55, speed: 0.002, size: 3.0, type: 'jupiter' }, 
      { name: "Saturn", radius: 78, speed: 0.0014, size: 2.5, type: 'saturn', hasRings: true }
    ];
    
    planets.forEach(p => {
      const ringGeo = new THREE.BufferGeometry(); const points = [];
      for (let i = 0; i <= 100; i++) { const t = (i/100)*Math.PI*2; points.push(new THREE.Vector3(Math.cos(t)*p.radius, 0, Math.sin(t)*p.radius)); }
      ringGeo.setFromPoints(points); 
      const orbitLine = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false }));
      solarSystem.add(orbitLine);
      
      const pivot = new THREE.Group(); solarSystem.add(pivot);
      
      let pMat = new THREE.MeshPhongMaterial({ map: textureLoader.load(TEX[p.type] || TEX.moon), shininess: 10 });
      const pMesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), pMat);
      pMesh.position.x = p.radius; 
      
      // Store original material for Spectrum filters
      pMesh.userData = { name: p.name, size: p.size, origMat: pMat }; 
      pivot.add(pMesh); p.pivot = pivot; p.mesh = pMesh; p.orbitLine = orbitLine;
      interactables.push(pMesh); allMeshes.push(pMesh);

      planetDataList.push(p);
      
      if (p.hasRings) {
          const rMesh = new THREE.Mesh(new THREE.TorusGeometry(p.size * 2, 0.1, 16, 100), new THREE.MeshPhongMaterial({ color: 0xcd853f, transparent: true, opacity: 0.8 }));
          rMesh.rotation.x = Math.PI / 2.1; 
          rMesh.userData = { origMat: rMesh.material };
          pMesh.add(rMesh); allMeshes.push(rMesh);
      }
    });

    // PULSAR FIX
    const pulsarGroup = new THREE.Group(); pulsarGroup.position.set(2000, 500, -2000); scene.add(pulsarGroup);
    const nStar = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    // Fix camera crash by setting a larger safe size in userData
    nStar.userData = { name: "Magnetic Pulsar", size: 20, origMat: nStar.material }; 
    interactables.push(nStar); allMeshes.push(nStar); pulsarGroup.add(nStar);
    
    const pBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 40, 2000, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    pBeam.userData = { origMat: pBeam.material };
    pulsarGroup.add(pBeam); allMeshes.push(pBeam);

    // INTERACTION LOGIC
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    let targetCamPos = null; let targetLookAt = null;

    window.addEventListener('pointerdown', (event) => {
        if(event.target.tagName === 'BUTTON' || event.target.closest('#radial-menu') || event.target.closest('.glass-panel') || event.target.closest('#info-panel') || event.target.closest('#telemetry-drawer')) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactables, false);
        if(intersects.length > 0) {
            const mesh = intersects[0].object;
            const name = mesh.userData.name;
            if(DATABASE[name]) {
                document.getElementById('infoTitle').textContent = name;
                document.getElementById('infoType').textContent = DATABASE[name].type;
                const list = document.getElementById('infoFactsList'); list.innerHTML = '';
                DATABASE[name].facts.forEach(f => { let li = document.createElement('li'); li.textContent = f; list.appendChild(li); });
                document.getElementById('info-panel').classList.add('visible');
            }
            
            const wPos = new THREE.Vector3(); mesh.getWorldPosition(wPos);
            targetLookAt = wPos.clone();
            const safeDist = Math.max(mesh.userData.size * 4, 15);
            targetCamPos = new THREE.Vector3(wPos.x + safeDist, wPos.y + (safeDist*0.5), wPos.z + safeDist);
            controls.target.copy(targetLookAt);
        }
    });

    window.resetCamera = function() {
        targetCamPos = new THREE.Vector3(0, 40, 100);
        targetLookAt = new THREE.Vector3(0, 0, 0);
        closeInfo(); toggleRadial();
    };

    // SPECTRUM FILTERS
    window.applyFilter = function(type) {
        allMeshes.forEach(mesh => {
            if(!mesh.userData.origMat) return;
            if(type === 'xray') {
                mesh.material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.8 });
            } else if(type === 'infrared') {
                mesh.material = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: false });
            } else {
                mesh.material = mesh.userData.origMat;
            }
        });
        toggleRadial();
    };

    // CELESTIAL TRANSMUTER LOGIC
    let currentTransmuteObj = null;

    window.triggerTransmutation = function(type) {
        // UI Handling
        toggleRadial(); document.getElementById('radial-menu').style.opacity = '0'; closeInfo();
        const drawer = document.getElementById('telemetry-drawer');
        
        // Remove old objects
        if(currentTransmuteObj) solarSystem.remove(currentTransmuteObj);
        sunCore.visible = false; sunGlow.visible = false;
        
        isPhysicsBroken = false;

        if (type === 'blackhole') {
            drawer.querySelector('#tel-title').textContent = "TRANSFORMATION: 1M☉ BLACK HOLE";
            drawer.querySelector('#tel-math').innerHTML = "<i>v = √(GM/r)</i> | Mass Remains Constant";
            drawer.querySelector('#tel-desc').textContent = "The Sun has collapsed into a singularity. Because its mass is identical, Earth's orbital velocity and trajectory do not change. However, total darkness and absolute zero temperatures will freeze the solar system.";
            
            currentTransmuteObj = new THREE.Group();
            const eventHorizon = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000}));
            const disk = new THREE.Mesh(new THREE.RingGeometry(1.5, 4, 64), new THREE.MeshBasicMaterial({color: 0xffaa44, side: THREE.DoubleSide, transparent: true, opacity: 0.8}));
            disk.rotation.x = Math.PI / 1.7;
            currentTransmuteObj.add(eventHorizon, disk);
            solarSystem.add(currentTransmuteObj);

        } else if (type === 'neutron') {
            drawer.querySelector('#tel-title').textContent = "TRANSFORMATION: NEUTRON STAR";
            drawer.querySelector('#tel-math').innerHTML = "<i>Density = Mass / Volume</i> | r → 10km";
            drawer.querySelector('#tel-desc').textContent = "Mass is maintained, but compressed into a hyper-dense sphere miles across. Orbits remain stable, but extreme radiation and magnetic fields strip planetary atmospheres instantly.";
            
            currentTransmuteObj = new THREE.Group();
            const ns = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({color: 0xffffff}));
            const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: softGlowTex, color: 0x55aaff, transparent: true, blending: THREE.AdditiveBlending }));
            aura.scale.set(15, 15, 1);
            currentTransmuteObj.add(ns, aura);
            solarSystem.add(currentTransmuteObj);

        } else if (type === 'saturn') {
            drawer.querySelector('#tel-title').textContent = "TRANSFORMATION: SATURN (MASS DROP)";
            drawer.querySelector('#tel-math').innerHTML = "<i>F = G(m₁m₂)/r²</i> | Gravitational Bond Broken";
            drawer.querySelector('#tel-desc').textContent = "The Sun is replaced by Saturn. Center mass drops by 99.9%. The gravitational force is no longer sufficient to bend the planets' trajectories. They will now fly off in straight tangential lines into deep space.";
            
            isPhysicsBroken = true; // Triggers tangential drift in render loop
            
            currentTransmuteObj = new THREE.Group();
            const sat = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 32), new THREE.MeshPhongMaterial({map: textureLoader.load(TEX.saturn)}));
            const rings = new THREE.Mesh(new THREE.TorusGeometry(5, 0.1, 16, 100), new THREE.MeshBasicMaterial({color: 0xcd853f}));
            rings.rotation.x = Math.PI/2.1;
            currentTransmuteObj.add(sat, rings);
            solarSystem.add(currentTransmuteObj);
            
            // Hide orbit lines because they are broken
            planetDataList.forEach(p => { p.orbitLine.visible = false; });
        }

        // Camera sweep
        targetCamPos = new THREE.Vector3(0, 20, 60);
        targetLookAt = new THREE.Vector3(0, 0, 0);
        controls.target.copy(targetLookAt);

        drawer.classList.add('visible');
    };

    window.resetSimulation = function() {
        toggleRadial();
        if(currentTransmuteObj) { solarSystem.remove(currentTransmuteObj); currentTransmuteObj = null; }
        sunCore.visible = true; sunGlow.visible = true;
        isPhysicsBroken = false;
        
        // Reset planet positions
        planetDataList.forEach(p => {
            p.mesh.position.set(p.radius, 0, 0);
            p.pivot.rotation.y = 0;
            p.orbitLine.visible = true;
        });
        resetCamera();
    };

    // BOOT CAMERA
    targetCamPos = new THREE.Vector3(0, 40, 100);
    targetLookAt = new THREE.Vector3(0, 0, 0);
    controls.target.copy(targetLookAt);

    function animate() {
      requestAnimationFrame(animate);
      
      // Rotations
      sunCore.rotation.y += 0.002;
      pulsarGroup.rotation.z += 0.08; pulsarGroup.rotation.y += 0.04;
      if(currentTransmuteObj) currentTransmuteObj.rotation.y -= 0.01;

      // Orbital Math
      planetDataList.forEach(p => { 
          p.mesh.rotation.y += 0.01;
          if (isPhysicsBroken) {
              // Planets fly away tangentially. Increase radius drastically.
              p.radius += p.speed * 200;
              p.mesh.position.x = p.radius;
          } else {
              // Normal Orbit
              p.pivot.rotation.y += p.speed; 
          }
      });

      // Camera Lerp
      if (targetCamPos && targetLookAt) {
          camera.position.lerp(targetCamPos, 0.05); 
          if (camera.position.distanceTo(targetCamPos) < 0.5) { targetCamPos = null; targetLookAt = null; }
      }

      controls.update(); 
      renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => { 
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight); 
    });
  </script>
</body>
</html>
