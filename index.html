<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox in Space - Vortex Engine v16.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- =========================================
         3D ENGINE CANVAS 
         ========================================= -->
    <canvas id="renderCanvas" style="width: 100vw; height: 100vh; display: block;"></canvas>

    <!-- =========================================
         LOADING SCREEN 
         ========================================= -->
    <div id="loading-screen">
        <h1 class="loading-title">LOADING..</h1>
        <div class="loading-planet"></div>
        <div id="loading-progress">0%</div>
    </div>

    <!-- =========================================
         MAIN MENU 
         ========================================= -->
    <div id="main-menu" class="hidden">
        <h1 class="menu-title">SANDBOX IN <br><span>SPACE</span></h1>
        <div class="menu-buttons">
            <button id="btn-start-game" class="menu-btn">START NEW GAME</button>
            <button class="menu-btn">RATING <span class="menu-icon">🔒</span></button>
            <button class="menu-btn">SETTINGS</button>
            <button class="menu-btn">SHOP <span class="menu-icon">🔒</span></button>
            <button class="menu-btn">EXIT</button>
        </div>
    </div>

    <!-- =========================================
         GAME UI (VORTEX ENGINE)
         ========================================= -->
    <div id="game-ui" class="hidden">
        
        <!-- Top Right Controls (Fullscreen) -->
        <div class="top-controls">
            <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen">⛶</button>
        </div>

        <!-- Left Sidebar (Tools & Toggles) -->
        <div class="sidebar" style="position: absolute; left: 0; top: 0; height: 100%; width: 60px; background: #1a1e24; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px;">
            <button class="icon-btn active" title="Select Pointer">⮞</button>
            <button id="btn-display-settings" class="icon-btn" title="Display Settings">⚙</button>
            <button id="btn-photo-mode" class="icon-btn" title="Photo Mode">📷</button>
        </div>

        <!-- Properties Panel (Right side) -->
        <div class="properties-panel" style="position: absolute; right: 20px; top: 80px; width: 300px; background: #1a1e24; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <div style="padding: 15px; background: #232830; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1rem; letter-spacing: 1px;">PROPERTIES</h2>
                <button style="background: none; border: none; color: #aaa; cursor: pointer;">✕</button>
            </div>
            
            <div style="display: flex; background: #1a1e24; border-bottom: 2px solid #333;">
                <button style="flex: 1; padding: 10px; background: none; border: none; color: #29b6f6; border-bottom: 2px solid #29b6f6;">Basic</button>
                <button style="flex: 1; padding: 10px; background: none; border: none; color: #888;">Advanced</button>
                <button style="flex: 1; padding: 10px; background: none; border: none; color: #888;">Actions</button>
            </div>

            <div style="padding: 15px;">
                <h3 style="font-size: 0.8rem; color: #888; margin-bottom: 10px; background: #232830; padding: 5px;">GENERAL DATA</h3>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;">
                    <label style="font-size: 0.9rem; color: #ccc;">Name</label>
                    <input type="text" id="prop-name" readonly style="background: #111; border: 1px solid #333; color: #fff; padding: 5px; width: 150px; text-align: right;">
                </div>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;">
                    <label style="font-size: 0.9rem; color: #ccc;">Mass</label>
                    <!-- This will now be injected by JS as standard scientific notation (kg) -->
                    <input type="text" id="prop-mass" readonly style="background: #111; border: 1px solid #29b6f6; color: #fff; padding: 5px; width: 150px; text-align: right;">
                </div>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center;">
                    <label style="font-size: 0.9rem; color: #ccc;">Radius</label>
                    <input type="text" id="prop-radius" readonly style="background: #111; border: 1px solid #333; color: #fff; padding: 5px; width: 150px; text-align: right;">
                </div>

                <h3 style="font-size: 0.8rem; color: #888; margin-bottom: 10px; background: #232830; padding: 5px;">TELEMETRY</h3>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <label style="font-size: 0.9rem; color: #ccc;">System Status</label>
                    <span style="font-size: 0.9rem; font-weight: bold; color: #fff;">NOMINAL</span>
                </div>

                <!-- Camera Tracking Button -->
                <button id="btn-track-body" style="width: 100%; padding: 10px; background: #29b6f6; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">
                    TRACK BODY
                </button>
            </div>
        </div>

        <!-- Bottom Status Bar -->
        <div class="bottom-bar" style="position: absolute; bottom: 0; left: 60px; right: 0; height: 30px; background: #111; border-top: 1px solid #222; display: flex; align-items: center; padding: 0 20px; gap: 30px; font-size: 0.8rem; color: #aaa;">
            <div>FPS: <span style="color: #fff;">60</span></div>
            <div>Bodies: <span style="color: #fff;">9</span> (Rendered)</div>
            <div>DAY: <span style="color: #fff;">42</span></div>
            <div style="margin-left: auto; color: #666;">Vortex Engine v16.1 PRO</div>
        </div>
    </div>

    <!-- Core Engine Scripts (Three.js/Babylon.js would go here) -->
    <!-- UI Logic Script -->
    <script src="script.js"></script>
</body>
</html>
