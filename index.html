<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The crucial viewport tag for Native Mobile Apps (handles Notch & disables zooming) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Project NEXT</title>
    
    <!-- Link to the PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- Three.js AAA Graphics Engine -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <!-- 3D Engine Canvas -->
    <div id="webgl-container"></div>
    
    <!-- Cinematic Transition Flash -->
    <div id="warp-flash"></div>

    <!-- NATIVE APP LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div id="loading-text">INITIALIZING ASSETS...</div>
        <div class="progress-container">
            <div id="loading-progress-bar"></div>
        </div>
    </div>

    <!-- NEXT STUDIOS MAIN MENU -->
    <div id="next-main-menu">
        <div class="menu-logo">NEXT STUDIOS</div>
        <div class="menu-sub">Colossal Universe Engine</div>
        <button class="btn-launch" onclick="launchGame()">Launch Simulation</button>
        <button id="btn-quality" class="btn-quality" onclick="toggleQuality()">GRAPHICS: HIGH</button>
    </div>

    <!-- IN-GAME HUD (Safe-Area Protected) -->
    <div id="hud-top">
        <div class="telemetry">
            <span id="fps-val">60 FPS</span>
            <span>TARGET: <span id="targetName" style="color: #fcd34d;">Free Camera</span></span>
        </div>
        <!-- Streamlined Warp Button -->
        <button id="ui-toggle" onclick="toggleWarpMenu()">WARP MENU</button>
    </div>

    <!-- DYNAMIC PLANET INFO PANEL -->
    <div id="info-panel">
        <div class="info-header">
            <span id="infoTitle" class="info-title">Star</span>
            <span class="info-close" onclick="closeInfoPanel()">×</span>
        </div>
        <span id="infoType" class="info-type">Type</span>
        
        <div class="info-facts-container">
            <ul id="infoFactsList" class="info-facts-list"></ul>
        </div>
        
        <button id="btnFreeCam" class="btn-free" onclick="freeCamera()">DISENGAGE LOCK</button>
    </div>

    <!-- WARP MENU DROPDOWN (Collision Free) -->
    <div id="fastTravelDropdown" class="menu-dropdown">
        <div class="menu-header">
            <span>SELECT WARP DESTINATION</span>
            <span class="close-btn" onclick="closeWarpMenu()">×</span>
        </div>
        <div class="menu-grid">
            <button class="btn-sci btn-warp" onclick="initiateWarp('home')">☀️ Solar System</button>
            <button class="btn-sci btn-warp" onclick="initiateWarp('proxima')">☄️ Proxima Centauri</button>
            <button class="btn-sci btn-warp" onclick="initiateWarp('orion')">🌌 Carina Nebula</button>
            <button class="btn-sci btn-warp" onclick="initiateWarp('vela')">⚡ Magnetic Pulsar</button>
            <button class="btn-sci btn-warp" onclick="initiateWarp('sagA')">👁️ Sagittarius A*</button>
            <button class="btn-sci btn-warp" onclick="initiateWarp('supernova')">💥 Binary Merger</button>
        </div>
    </div>

    <!-- Core Logic Engine -->
    <script type="module" src="./main.js"></script>

</body>
</html>
