<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vortex Engine V16.1</title>
  
  <!-- CACHE BUSTING: Forces mobile browsers to download the newest CSS -->
  <link rel="stylesheet" href="style.css?v=2">
  
  <!-- Load Three.js Engine & Touch Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="webgl-container"></div>

  <!-- AAA Top HUD Navigation Bar -->
  <div id="main-ui">
    <div class="hud-brand">
      <h1>VORTEX</h1>
      <span class="version-badge">V16.1 STABLE</span>
    </div>
    
    <div class="hud-telemetry">
      <div class="telemetry-item">
        <span class="telemetry-label">SYSTEM STATUS</span>
        <span class="telemetry-value nominal">NOMINAL</span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">ACTIVE ENTITIES</span>
        <span class="telemetry-value">6 BODIES</span>
      </div>
    </div>
    
    <button id="btn-nav" class="hud-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      MENU
    </button>
  </div>

  <!-- AAA WARP NAVIGATION TERMINAL -->
  <div id="nav-modal">
    <div class="modal-terminal">
      <div class="terminal-header">WARP NAVIGATION</div>
      
      <div class="terminal-list">
        <button class="nav-target-btn" data-target="solar">SOLAR SYSTEM</button>
        <button class="nav-target-btn" data-target="pulsar">MAGNETIC PULSAR</button>
        <button class="nav-target-btn" data-target="blackhole">SUPERMASSIVE BLACK HOLE</button>
        <button class="nav-target-btn" data-target="nebula">DEEP SPACE NEBULA</button>
      </div>
      
      <button class="terminal-close" id="btn-close-menu">CLOSE TERMINAL</button>
    </div>
  </div>

  <!-- CACHE BUSTING: Forces mobile browsers to download the newest JS -->
  <script src="main.js?v=2"></script>

</body>
</html>
